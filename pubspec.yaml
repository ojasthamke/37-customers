name: aplibhaji_customers
description: "A mobile-first customer shopping app for ApliBhaji."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.5.1

  # Database
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.4+4
  path: ^1.9.0
  path_provider: ^2.1.3

  uuid: ^4.4.0
  intl: ^0.19.0
  crypto: ^3.0.3
  supabase_flutter: ^2.6.0
  google_fonts: ^6.3.0
  supabase: ^2.13.4
  url_launcher: ^6.3.1
  connectivity_plus: ^6.0.3
  flutter_secure_storage: ^9.2.2
  
  # Notifications
  flutter_local_notifications: ^19.5.0
  flutter_timezone: ^4.1.1
  timezone: ^0.10.1
  firebase_core: ^3.3.0
  firebase_messaging: ^15.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.jpg"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/logo.jpg
    - assets/orderkart_logo.jpg
    - assets/orderkart_logo.png
    - assets/splash_bg.jpg
